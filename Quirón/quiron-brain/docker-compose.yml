services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.16.3
    container_name: quiron-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  # Neo4j Graph Database (legacy, optional)
  neo4j:
    image: neo4j:5.15-community
    container_name: quiron-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/quiron_brain_2026
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: [ "CMD", "cypher-shell", "-u", "neo4j", "-p", "quiron_brain_2026", "RETURN 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  qdrant_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/kssose/Quirón/data/qdrant
  neo4j_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/kssose/Quirón/data/neo4j
  neo4j_logs:
