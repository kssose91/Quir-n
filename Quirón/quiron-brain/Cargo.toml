[package]
name = "quiron-brain"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Neural memory system for AI agents - obligatory brain"
authors = ["Llore"]



[dependencies]
# Storage - sled is pure Rust, no C++ dependency
sled = "0.34"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"  # Stable enum repr(u8) serialization
bincode = "1.3"
toml = "0.8"

# IDs y tiempo
ulid = { version = "1.1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP Server
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# Async
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Crypto/Hashing
blake3 = "1.5"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Hex encoding (for logs)
hex = "0.4"

# Regex for pattern matching
regex = "1"
unicode-normalization = "0.1"
walkdir = "2"
clap = { version = "4.5", features = ["derive", "env"] }

# Neo4j (optional)
neo4rs = { version = "0.8", optional = true }

# HTTP client for LLM calls (always available)
reqwest = { version = "0.12", features = ["json"] }

# Qdrant semantic search (optional)
qdrant-client = { version = "1.16", optional = true }
fastembed = { version = "5.12.1", default-features = false, features = ["hf-hub-native-tls", "ort-download-binaries-native-tls"], optional = true }
libc = "0.2.180"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }

[features]
# `full` por defecto: sin él, los bloques #[cfg(feature = "semantic")] y
# #[cfg(feature = "neo4j")] desaparecen y la recuperación deja de consultar
# el índice y el grafo en silencio. Fue la causa raíz del diagnóstico de julio.
default = ["full"]
hash-chain = []
neo4j = ["neo4rs"]
semantic = ["qdrant-client", "fastembed"]
full = ["neo4j", "semantic"]



required-features = ["neo4j"]




[[bench]]
name = "ledger_bench"
harness = false

[[bench]]
name = "vct_bench"
harness = false

[[bench]]
name = "keyword_search_bench"
harness = false
